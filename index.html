<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Dash - Cyber Flappy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 840px;
            background: #070b19;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            #game-container {
                border-radius: 0;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Overlay / Screen Layouts */
        .screen {
            position: absolute;
            inset: 0;
            background: rgba(7, 11, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
            pointer-events: auto;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .watermark {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 24px;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 5px 10px -3px rgba(99, 102, 241, 0.4);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .score-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .icon-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .skin-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }

        .skin-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .skin-dot.active {
            border-color: #ffffff;
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div class="ui-layer">
            <div class="hud">
                <div class="score-display interactive" id="hud-score">0</div>
                <button class="icon-btn interactive hidden" id="pause-btn">⏸</button>
            </div>
        </div>

        <!-- Start / Main Menu Screen -->
        <div class="screen" id="start-screen">
            <h1 class="title">AETHER DASH</h1>
            <div class="watermark">made by berat</div>

            <div class="card">
                <div style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px;">KARAKTER TEMA SEÇİMİ</div>
                <div class="skin-selector" id="skin-selector"></div>
            </div>

            <button class="btn" id="start-btn">OYUNA BAŞLA</button>
        </div>

        <!-- Pause Screen -->
        <div class="screen hidden" id="pause-screen">
            <h2 class="title" style="font-size: 2rem;">DURDURULDU</h2>
            <button class="btn" id="resume-btn" style="margin-top: 20px;">DEVAM ET</button>
        </div>

        <!-- Game Over Screen -->
        <div class="screen hidden" id="gameover-screen">
            <h2 class="title" style="color: #f87171;">OUN BİTTİ</h2>
            <div class="watermark">made by berat</div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                    <span style="color: #94a3b8;">SKOR</span>
                    <span id="final-score" style="font-weight: 800; font-size: 1.2rem;">0</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #94a3b8;">EN YÜKSEK SKOR</span>
                    <span id="best-score" style="font-weight: 800; font-size: 1.2rem; color: #fbbf24;">0</span>
                </div>
            </div>

            <button class="btn" id="restart-btn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        // Game Configurations
        const CONFIG = {
            GRAVITY: 0.35,
            JUMP_FORCE: -6.8,
            PIPE_SPEED: 2.3,
            PIPE_SPAWN_RATE: 100,
            PIPE_GAP: 140,
            PIPE_WIDTH: 52,
            GROUND_HEIGHT: 60
        };

        const SKINS = [
            { name: 'Neon Cyber', core: '#38bdf8', color1: '#6366f1', color2: '#a855f7' },
            { name: 'Solar Flare', core: '#fde047', color1: '#f97316', color2: '#ef4444' },
            { name: 'Emerald Volt', core: '#6ee7b7', color1: '#10b981', color2: '#047857' }
        ];

        // Synthesized Web Audio Sound Effects
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playScore() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playGameOver() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        // Main Engine Class
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.sounds = new SoundFX();

                this.state = 'START'; // START, PLAYING, PAUSED, GAMEOVER
                this.currentSkinIndex = 0;
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('aether_best') || '0');

                this.shakeTimer = 0;
                this.shakeIntensity = 0;

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.initSkinsUI();
                this.setupInputs();
                this.initEntities();

                requestAnimationFrame((t) => this.loop(t));
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.width = rect.width;
                this.height = rect.height;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }

            initSkinsUI() {
                const container = document.getElementById('skin-selector');
                container.innerHTML = '';
                SKINS.forEach((skin, index) => {
                    const dot = document.createElement('div');
                    dot.className = `skin-dot ${index === this.currentSkinIndex ? 'active' : ''}`;
                    dot.style.background = `linear-gradient(135deg, ${skin.color1}, ${skin.color2})`;
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.currentSkinIndex = index;
                        document.querySelectorAll('.skin-dot').forEach((d, i) => {
                            d.classList.toggle('active', i === index);
                        });
                    });
                    container.appendChild(dot);
                });
            }

            initEntities() {
                this.player = {
                    x: this.width * 0.28,
                    y: this.height * 0.45,
                    vy: 0,
                    radius: 14,
                    rotation: 0,
                    wingAngle: 0
                };

                this.pipes = [];
                this.coinsList = [];
                this.particles = [];
                this.bgParticles = Array.from({ length: 30 }, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * (this.height - CONFIG.GROUND_HEIGHT),
                    radius: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.4 + 0.1
                }));

                this.frameCount = 0;
            }

            setupInputs() {
                const triggerJump = () => {
                    this.sounds.init();
                    if (this.state === 'PLAYING') {
                        this.playerJump();
                    }
                };

                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') triggerJump();
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    triggerJump();
                }, { passive: false });

                this.canvas.addEventListener('mousedown', (e) => {
                    if (e.button === 0) triggerJump();
                });

                document.getElementById('start-btn').addEventListener('click', () => {
                    this.sounds.init();
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('pause-btn').classList.remove('hidden');
                    this.state = 'PLAYING';
                    this.playerJump();
                });

                document.getElementById('pause-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.state === 'PLAYING') {
                        this.state = 'PAUSED';
                        document.getElementById('pause-screen').classList.remove('hidden');
                    }
                });

                document.getElementById('resume-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.state = 'PLAYING';
                    document.getElementById('pause-screen').classList.add('hidden');
                });

                document.getElementById('restart-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.resetGame();
                });
            }

            playerJump() {
                this.player.vy = CONFIG.JUMP_FORCE;
                this.sounds.playJump();

                // Particle effect on jump
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: this.player.x - 6,
                        y: this.player.y + 6,
                        vx: (Math.random() - 0.5) * 3 - 2,
                        vy: Math.random() * 2 + 1,
                        alpha: 1,
                        color: SKINS[this.currentSkinIndex].core,
                        size: Math.random() * 3 + 1
                    });
                }
            }

            triggerShake(intensity, duration) {
                this.shakeIntensity = intensity;
                this.shakeTimer = duration;
            }

            spawnPipe() {
                const minPipe = 50;
                const maxPipe = this.height - CONFIG.GROUND_HEIGHT - CONFIG.PIPE_GAP - minPipe;
                const top = Math.floor(Math.random() * (maxPipe - minPipe)) + minPipe;
                const bottom = this.height - CONFIG.GROUND_HEIGHT - top - CONFIG.PIPE_GAP;

                this.pipes.push({
                    x: this.width,
                    top: top,
                    bottom: bottom,
                    passed: false
                });

                // Spawn collectible coin
                if (Math.random() > 0.4) {
                    this.coinsList.push({
                        x: this.width + CONFIG.PIPE_WIDTH / 2,
                        y: top + CONFIG.PIPE_GAP / 2 + (Math.random() - 0.5) * 30,
                        radius: 7,
                        collected: false
                    });
                }
            }

            update() {
                if (this.state !== 'PLAYING') return;

                this.frameCount++;

                // Kademeli Hız Artış Mantığı (Skor arttıkça boruların geliş hızı tatlıca artar)
                const currentSpeed = CONFIG.PIPE_SPEED + Math.min(3, this.score * 0.1);

                // Player physics
                this.player.vy += CONFIG.GRAVITY;
                this.player.y += this.player.vy;
                this.player.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, (this.player.vy * 0.08)));
                this.player.wingAngle += 0.25;

                // Ground & Ceiling collision
                if (this.player.y + this.player.radius >= this.height - CONFIG.GROUND_HEIGHT || this.player.y - this.player.radius <= 0) {
                    this.gameOver();
                }

                // Background particles update
                this.bgParticles.forEach(p => {
                    p.x -= p.speed;
                    if (p.x < 0) p.x = this.width;
                });

                // Pipes spawn and update
                if (this.frameCount % CONFIG.PIPE_SPAWN_RATE === 0) {
                    this.spawnPipe();
                }

                this.pipes.forEach(pipe => {
                    pipe.x -= currentSpeed;

                    // Collision detection
                    const inPipeX = this.player.x + this.player.radius > pipe.x && this.player.x - this.player.radius < pipe.x + CONFIG.PIPE_WIDTH;
                    const hitTop = this.player.y - this.player.radius < pipe.top;
                    const hitBottom = this.player.y + this.player.radius > this.height - CONFIG.GROUND_HEIGHT - pipe.bottom;

                    if (inPipeX && (hitTop || hitBottom)) {
                        this.gameOver();
                    }

                    // Score calculation
                    if (!pipe.passed && pipe.x + CONFIG.PIPE_WIDTH < this.player.x) {
                        pipe.passed = true;
                        this.score++;
                        document.getElementById('hud-score').innerText = this.score;
                        this.sounds.playScore();
                    }
                });

                this.pipes = this.pipes.filter(pipe => pipe.x + CONFIG.PIPE_WIDTH > -20);

                // Collectibles update
                this.coinsList.forEach(c => {
                    c.x -= currentSpeed;
                    if (!c.collected) {
                        const dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                        if (dist < this.player.radius + c.radius) {
                            c.collected = true;
                            this.score += 2;
                            document.getElementById('hud-score').innerText = this.score;
                            this.sounds.playScore();
                        }
                    }
                });
                this.coinsList = this.coinsList.filter(c => c.x > -20);

                // Dynamic Particles
                this.particles.forEach(pt => {
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.alpha -= 0.03;
                });
                this.particles = this.particles.filter(pt => pt.alpha > 0);

                // Screen shake timer update
                if (this.shakeTimer > 0) {
                    this.shakeTimer--;
                }
            }

            gameOver() {
                this.state = 'GAMEOVER';
                this.sounds.playHit();
                this.sounds.playGameOver();
                this.triggerShake(8, 20);
                document.getElementById('pause-btn').classList.add('hidden');

                for (let i = 0; i < 16; i++) {
                    this.particles.push({
                        x: this.player.x,
                        y: this.player.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        alpha: 1,
                        color: '#f87171',
                        size: Math.random() * 4 + 2
                    });
                }

                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('aether_best', this.bestScore);
                }

                document.getElementById('final-score').innerText = this.score;
                document.getElementById('best-score').innerText = this.bestScore;

                setTimeout(() => {
                    document.getElementById('gameover-screen').classList.remove('hidden');
                }, 400);
            }

            resetGame() {
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('pause-btn').classList.remove('hidden');
                this.score = 0;
                document.getElementById('hud-score').innerText = '0';
                this.frameCount = 0;
                this.initEntities();
                this.state = 'PLAYING';
                this.playerJump();
            }

            render() {
                this.ctx.save();

                // Screen Shake Transformation
                if (this.shakeTimer > 0) {
                    const dx = (Math.random() - 0.5) * this.shakeIntensity;
                    const dy = (Math.random() - 0.5) * this.shakeIntensity;
                    this.ctx.translate(dx, dy);
                }

                // Background Gradient
                const bgGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
                bgGrad.addColorStop(0, '#070b19');
                bgGrad.addColorStop(1, '#171435');
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Background Star Dust
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                this.bgParticles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                // Render Pipes
                this.pipes.forEach(pipe => {
                    const skin = SKINS[this.currentSkinIndex];
                    const pipeGrad = this.ctx.createLinearGradient(pipe.x, 0, pipe.x + CONFIG.PIPE_WIDTH, 0);
                    pipeGrad.addColorStop(0, skin.color1);
                    pipeGrad.addColorStop(1, skin.color2);

                    // Top Pipe
                    this.ctx.fillStyle = pipeGrad;
                    this.ctx.fillRect(pipe.x, 0, CONFIG.PIPE_WIDTH, pipe.top);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.globalAlpha = 0.25;
                    this.ctx.fillRect(pipe.x, 0, 6, pipe.top);
                    this.ctx.globalAlpha = 1.0;

                    // Top Pipe Cap
                    this.ctx.fillStyle = skin.core;
                    this.ctx.fillRect(pipe.x - 4, pipe.top - 16, CONFIG.PIPE_WIDTH + 8, 16);

                    // Bottom Pipe
                    const bottomY = this.height - CONFIG.GROUND_HEIGHT - pipe.bottom;
                    this.ctx.fillStyle = pipeGrad;
                    this.ctx.fillRect(pipe.x, bottomY, CONFIG.PIPE_WIDTH, pipe.bottom);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.globalAlpha = 0.25;
                    this.ctx.fillRect(pipe.x, bottomY, 6, pipe.bottom);
                    this.ctx.globalAlpha = 1.0;

                    // Bottom Pipe Cap
                    this.ctx.fillStyle = skin.core;
                    this.ctx.fillRect(pipe.x - 4, bottomY, CONFIG.PIPE_WIDTH + 8, 16);
                });

                // Render Coins
                this.coinsList.forEach(c => {
                    if (c.collected) return;
                    this.ctx.save();
                    this.ctx.shadowColor = '#fbbf24';
                    this.ctx.shadowBlur = 12;
                    this.ctx.fillStyle = '#fbbf24';
                    this.ctx.beginPath();
                    this.ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fff9c4';
                    this.ctx.beginPath();
                    this.ctx.arc(c.x - 2, c.y - 2, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Render Ground
                const groundY = this.height - CONFIG.GROUND_HEIGHT;
                const groundGrad = this.ctx.createLinearGradient(0, groundY, 0, this.height);
                groundGrad.addColorStop(0, '#1e293b');
                groundGrad.addColorStop(1, '#090d16');
                this.ctx.fillStyle = groundGrad;
                this.ctx.fillRect(0, groundY, this.width, CONFIG.GROUND_HEIGHT);

                this.ctx.strokeStyle = SKINS[this.currentSkinIndex].color1;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, groundY);
                this.ctx.lineTo(this.width, groundY);
                this.ctx.stroke();

                // Render Particles
                this.particles.forEach(pt => {
                    this.ctx.fillStyle = pt.color;
                    this.ctx.globalAlpha = pt.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                });

                // Render Player
                this.ctx.save();
                this.ctx.translate(this.player.x, this.player.y);
                this.ctx.rotate(this.player.rotation);

                const skin = SKINS[this.currentSkinIndex];
                this.ctx.shadowColor = skin.color1;
                this.ctx.shadowBlur = 16;

                const bodyGrad = this.ctx.createRadialGradient(-4, -4, 2, 0, 0, this.player.radius);
                bodyGrad.addColorStop(0, skin.core);
                bodyGrad.addColorStop(0.6, skin.color1);
                bodyGrad.addColorStop(1, skin.color2);

                this.ctx.fillStyle = bodyGrad;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, this.player.radius, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.shadowBlur = 0;

                // Eye
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath();
                this.ctx.arc(6, -4, 4, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.fillStyle = '#0b0f19';
                this.ctx.beginPath();
                this.ctx.arc(7, -4, 1.5, 0, Math.PI * 2);
                this.ctx.fill();

                // Wing
                this.ctx.fillStyle = skin.core;
                this.ctx.beginPath();
                let wingOffsetY = Math.sin(this.player.wingAngle) * 4;
                this.ctx.ellipse(-4, 2 + wingOffsetY, 6, 4, Math.PI / 6, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.restore();
                this.ctx.restore();
            }

            loop(timestamp) {
                this.update();
                this.render();
                requestAnimationFrame((t) => this.loop(t));
            }
        }

        // Initialize Game on Load
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
