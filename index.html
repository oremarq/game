<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aether Flight: Ultimate Odyssey</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070c;
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            position: fixed;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #0b0f19;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays & Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom)) 24px;
            z-index: 10;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .screen.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
            visibility: hidden;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-group {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
        }

        .icon-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.25);
        }

        /* HUD Score */
        #hud {
            position: absolute;
            top: calc(24px + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #hud-score {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            letter-spacing: 2px;
            transition: transform 0.1s ease;
            line-height: 1;
        }

        #hud-score.pop {
            transform: scale(1.25);
            color: #6ee7b7;
        }

        #hud-coins {
            font-size: 15px;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Start Screen */
        .brand-container {
            text-align: center;
            margin-top: 12vh;
        }

        .game-title {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, #6ee7b7, #3b82f6, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 16px rgba(59, 130, 246, 0.4));
        }

        .game-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .menu-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .tap-prompt {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            padding: 18px 36px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            animation: pulse-glow 2s infinite ease-in-out;
            border: 1px solid rgba(255,255,255,0.25);
            transition: transform 0.15s ease;
            text-align: center;
            width: 100%;
            max-width: 280px;
            letter-spacing: 1px;
        }

        .tap-prompt:active {
            transform: scale(0.95);
        }

        .skin-select-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 280px;
            backdrop-filter: blur(10px);
        }

        .skin-info span {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .skin-info b {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
        }

        .skin-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .skin-btn:active { background: rgba(255, 255, 255, 0.3); }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 15px 40px rgba(59, 130, 246, 0.75); }
        }

        /* Game Over Panel */
        .game-over-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 28px 24px;
            width: 88%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.7);
            animation: panel-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            margin: auto;
        }

        @keyframes panel-pop {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .game-over-title {
            font-size: 24px;
            font-weight: 900;
            color: #f87171;
            margin-bottom: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .score-item label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .score-item span {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
        }

        .primary-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .primary-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* Pause Modal */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.8);
            backdrop-filter: blur(15px);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.2s;
        }
        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        .modal-box {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 80%;
            max-width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-box h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-box button {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .resume-btn { background: #3b82f6; color: #fff; }
        .quit-btn { background: rgba(255,255,255,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.3) !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Layer -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Score Layer -->
        <div id="hud">
            <div id="hud-score">0</div>
            <div id="hud-coins">🪙 <span id="hud-coin-count">0</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="top-bar">
                <div class="icon-group">
                    <div class="icon-btn interactive" id="sound-btn-start" title="Ses Aç/Kapat">
                        <svg id="sound-icon-start" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </div>
                </div>
            </div>
            <div class="brand-container">
                <h1 class="game-title">Aether Flight</h1>
                <p class="game-subtitle">Ultimate Odyssey</p>
            </div>
            <div class="menu-center">
                <div class="skin-select-box interactive">
                    <button class="skin-btn" id="prev-skin">‹</button>
                    <div class="skin-info">
                        <span>Karakter Stili</span>
                        <b id="skin-name">Neon Cyber</b>
                    </div>
                    <button class="skin-btn" id="next-skin">›</button>
                </div>
                <div class="tap-prompt interactive" id="start-btn">
                    OYUNA BAŞLA
                </div>
            </div>
            <div></div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="top-bar">
                <div class="icon-group">
                    <div class="icon-btn interactive" id="sound-btn-over">
                        <svg id="sound-icon-over" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </div>
                </div>
            </div>
            <div class="game-over-panel interactive">
                <div class="game-over-title">Oyun Bitti</div>
                <div class="score-board">
                    <div class="score-item">
                        <label>Skor</label>
                        <span id="final-score">0</span>
                    </div>
                    <div class="score-item">
                        <label>En İyi</label>
                        <span id="best-score">0</span>
                    </div>
                </div>
                <button class="primary-btn interactive" id="restart-btn">Tekrar Oyna</button>
            </div>
            <div></div>
        </div>

        <!-- In-Game Pause Button -->
        <div id="pause-container" style="position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; z-index: 8; pointer-events: none;">
            <div class="icon-btn interactive hidden" id="pause-btn" style="width: 38px; height: 38px; border-radius: 12px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="modal-overlay hidden">
            <div class="modal-box interactive">
                <h2>Oyun Duraklatıldı</h2>
                <button class="resume-btn" id="resume-btn">Devam Et</button>
                <button class="quit-btn" id="quit-btn">Ana Menü</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS & CONFIGURATION ---
        const CONFIG = {
            GRAVITY: 0.36,
            JUMP_FORCE: -6.8,
            BASE_PIPE_SPEED: 2.8,
            MAX_PIPE_SPEED: 4.8,
            PIPE_SPAWN_INTERVAL: 125, // frames
            PIPE_GAP: 155,
            PIPE_WIDTH: 68,
            GROUND_HEIGHT: 65
        };

        const SKINS = [
            { name: "Neon Cyber", color1: "#38bdf8", color2: "#2563eb", core: "#6ee7b7" },
            { name: "Solar Flare", color1: "#fbbf24", color2: "#f97316", core: "#fef08a" },
            { name: "Void Phantom", color1: "#a855f7", color2: "#6b21a8", core: "#e879f9" },
            { name: "Emerald Pulse", color1: "#34d399", color2: "#059669", core: "#a7f3d0" }
        ];

        // --- SOUND SYSTEM (Web Audio API) ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = localStorage.getItem('aether_mute') === 'true';
                this.initListeners();
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                } else if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            initListeners() {
                const updateIcons = () => {
                    const icons = [document.getElementById('sound-icon-start'), document.getElementById('sound-icon-over')];
                    icons.forEach(icon => {
                        if (!icon) return;
                        if (this.muted) {
                            icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
                        } else {
                            icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
                        }
                    });
                };
                updateIcons();

                ['sound-btn-start', 'sound-btn-over'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.muted = !this.muted;
                            localStorage.setItem('aether_mute', this.muted);
                            updateIcons();
                            if (!this.muted) this.playPop();
                        });
                    }
                });
            }

            playTone(freq, type, duration, vol = 0.1, freqEnd = null) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (freqEnd) {
                        osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playPop() { this.playTone(480, 'sine', 0.1, 0.12, 720); }
            playScore() { this.playTone(587.33, 'triangle', 0.12, 0.08); setTimeout(() => this.playTone(880, 'triangle', 0.15, 0.08), 70); }
            playCoin() { this.playTone(987.77, 'sine', 0.08, 0.1, 1318.51); }
            playHit() { this.playTone(140, 'sawtooth', 0.22, 0.15, 50); }
            playGameOver() { this.playTone(200, 'sawtooth', 0.35, 0.15, 70); }
        }

        // --- GAME ENGINE ---
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.sounds = new SoundSystem();
                
                this.state = 'START'; // START, PLAYING, PAUSED, GAMEOVER
                this.score = 0;
                this.coins = parseInt(localStorage.getItem('aether_coins') || '0');
                this.bestScore = parseInt(localStorage.getItem('aether_best') || '0');
                this.currentSkinIndex = parseInt(localStorage.getItem('aether_skin') || '0');
                
                this.frameCount = 0;
                this.shakeTimer = 0;
                this.shakeIntensity = 0;

                document.getElementById('hud-coin-count').innerText = this.coins;

                this.setupCanvas();
                this.initEntities();
                this.initInputs();

                window.addEventListener('resize', () => this.setupCanvas());
                requestAnimationFrame((t) => this.loop(t));
            }

            setupCanvas() {
                const container = document.getElementById('game-container');
                this.width = container.clientWidth;
                this.height = container.clientHeight;
                
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.ctx.scale(dpr, dpr);
            }

            initEntities() {
                this.player = {
                    x: this.width * 0.26,
                    y: this.height * 0.4,
                    radius: 16,
                    vy: 0,
                    rotation: 0,
                    wingAngle: 0
                };
                this.pipes = [];
                this.coinsList = [];
                this.particles = [];
                this.bgParticles = Array.from({length: 22}, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    radius: Math.random() * 2 + 1,
                    speed: Math.random() * 0.4 + 0.2
                }));
            }

            initInputs() {
                // Skin selection in menu
                document.getElementById('prev-skin').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.currentSkinIndex = (this.currentSkinIndex - 1 + SKINS.length) % SKINS.length;
                    this.updateSkinUI();
                });
                document.getElementById('next-skin').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.currentSkinIndex = (this.currentSkinIndex + 1) % SKINS.length;
                    this.updateSkinUI();
                });
                this.updateSkinUI();

                // Main control input (Keyboard & Pointer)
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.handlePlayerAction();
                    }
                });

                window.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.interactive')) return;
                    e.preventDefault();
                    this.handlePlayerAction();
                }, { passive: false });

                // UI buttons
                document.getElementById('start-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.startGame();
                });

                document.getElementById('restart-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.resetGame();
                });

                const pauseBtn = document.getElementById('pause-btn');
                pauseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.togglePause();
                });

                document.getElementById('resume-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.togglePause();
                });

                document.getElementById('quit-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.quitToMenu();
                });
            }

            updateSkinUI() {
                const skin = SKINS[this.currentSkinIndex];
                document.getElementById('skin-name').innerText = skin.name;
                localStorage.setItem('aether_skin', this.currentSkinIndex);
            }

            handlePlayerAction() {
                if (this.state === 'START') {
                    this.startGame();
                } else if (this.state === 'PLAYING') {
                    this.playerJump();
                }
                // Note: GAMEOVER state ignores quick taps to prevent accidental looping/restarting bugs.
            }

            startGame() {
                this.state = 'PLAYING';
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('pause-btn').classList.remove('hidden');
                this.sounds.init();
                this.playerJump();
            }

            togglePause() {
                if (this.state === 'PLAYING') {
                    this.state = 'PAUSED';
                    document.getElementById('pause-modal').classList.remove('hidden');
                } else if (this.state === 'PAUSED') {
                    this.state = 'PLAYING';
                    document.getElementById('pause-modal').classList.add('hidden');
                }
            }

            quitToMenu() {
                this.state = 'START';
                document.getElementById('pause-modal').classList.add('hidden');
                document.getElementById('pause-btn').classList.add('hidden');
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
                this.score = 0;
                document.getElementById('hud-score').innerText = '0';
                this.initEntities();
            }

            playerJump() {
                this.player.vy = CONFIG.JUMP_FORCE;
                this.sounds.playPop();
                
                for(let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: this.player.x - 10,
                        y: this.player.y + 10,
                        vx: (Math.random() - 0.5) * 3 - 2,
                        vy: (Math.random() - 0.5) * 3,
                        alpha: 1,
                        color: SKINS[this.currentSkinIndex].core,
                        size: Math.random() * 3 + 2
                    });
                }
            }

            triggerShake(intensity = 6, duration = 15) {
                this.shakeIntensity = intensity;
                this.shakeTimer = duration;
            }

            spawnPipe() {
                const minHeight = 70;
                const maxHeight = this.height - CONFIG.GROUND_HEIGHT - CONFIG.PIPE_GAP - 70;
                const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                this.pipes.push({
                    x: this.width,
                    top: topHeight,
                    bottom: this.height - CONFIG.GROUND_HEIGHT - topHeight - CONFIG.PIPE_GAP,
                    passed: false
                });

                // Spawn collectible coin in the middle of the gap
                if (Math.random() < 0.6) {
                    this.coinsList.push({
                        x: this.width + CONFIG.PIPE_WIDTH / 2,
                        y: topHeight + CONFIG.PIPE_GAP / 2,
                        radius: 10,
                        collected: false
                    });
                }
            }

            update() {
                // Parallax background particles update
                this.bgParticles.forEach(p => {
                    p.x -= p.speed;
                    if (p.x < 0) p.x = this.width;
                });

                if (this.state === 'START') {
                    this.player.y = (this.height * 0.4) + Math.sin(Date.now() / 200) * 8;
                    this.player.wingAngle = Math.sin(Date.now() / 100) * 0.3;
                    return;
                }

                if (this.state === 'PAUSED') return;

                if (this.state === 'PLAYING') {
                    this.frameCount++;
                    
                    // Dynamic progressive speed
                    const currentSpeed = Math.min(CONFIG.MAX_PIPE_SPEED, CONFIG.BASE_PIPE_SPEED + Math.floor(this.score / 10) * 0.3);

                    // Player physics
                    this.player.vy += CONFIG.GRAVITY;
                    this.player.y += this.player.vy;

                    let targetRot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.player.vy / 11)));
                    this.player.rotation += (targetRot - this.player.rotation) * 0.2;
                    this.player.wingAngle += 0.2;

                    // Pipe spawning
                    if (this.frameCount % CONFIG.PIPE_SPAWN_INTERVAL === 0) {
                        this.spawnPipe();
                    }

                    // Update Coins
                    for (let i = this.coinsList.length - 1; i >= 0; i--) {
                        let c = this.coinsList[i];
                        c.x -= currentSpeed;

                        // Check collection
                        const dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
                        if (!c.collected && dist < this.player.radius + c.radius) {
                            c.collected = true;
                            this.coins++;
                            localStorage.setItem('aether_coins', this.coins);
                            document.getElementById('hud-coin-count').innerText = this.coins;
                            this.sounds.playCoin();
                        }

                        if (c.x < -50 || c.collected) {
                            this.coinsList.splice(i, 1);
                        }
                    }

                    // Update Pipes & Collisions
                    for (let i = this.pipes.length - 1; i >= 0; i--) {
                        let pipe = this.pipes[i];
                        pipe.x -= currentSpeed;

                        // Score counting
                        if (!pipe.passed && pipe.x + CONFIG.PIPE_WIDTH < this.player.x) {
                            pipe.passed = true;
                            this.score++;
                            this.sounds.playScore();
                            const hudScore = document.getElementById('hud-score');
                            hudScore.innerText = this.score;
                            hudScore.classList.add('pop');
                            setTimeout(() => hudScore.classList.remove('pop'), 100);
                        }

                        // Remove offscreen pipes
                        if (pipe.x + CONFIG.PIPE_WIDTH < 0) {
                            this.pipes.splice(i, 1);
                        }

                        // Collision detection
                        const p = this.player;
                        const margin = 5;
                        if (
                            p.x + p.radius - margin > pipe.x &&
                            p.x - p.radius + margin < pipe.x + CONFIG.PIPE_WIDTH &&
                            (p.y - p.radius + margin < pipe.top || p.y + p.radius - margin > this.height - CONFIG.GROUND_HEIGHT - pipe.bottom)
                        ) {
                            this.gameOver();
                        }
                    }

                    // Ground & ceiling collision
                    if (this.player.y + this.player.radius >= this.height - CONFIG.GROUND_HEIGHT || this.player.y - this.player.radius <= 0) {
                        this.gameOver();
                    }
                }

                // Particles update
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let pt = this.particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.alpha -= 0.03;
                    if (pt.alpha <= 0) this.particles.splice(i, 1);
                }

                // Screen shake update
                if (this.shakeTimer > 0) {
                    this.shakeTimer--;
                }
            }

            gameOver() {
                this.state = 'GAMEOVER';
                this.sounds.playHit();
                this.sounds.playGameOver();
                this.triggerShake(8, 20);
                document.getElementById('pause-btn').classList.add('hidden');

                for(let i = 0; i < 16; i++) {
                    this.particles.push({
                        x: this.player.x,
                        y: this.player.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        alpha: 1,
                        color: '#f87171',
                        size: Math.random() * 4 + 2
                    });
                }

                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('aether_best', this.bestScore);
                }

                document.getElementById('final-score').innerText = this.score;
                document.getElementById('best-score').innerText = this.bestScore;
                
                setTimeout(() => {
                    document.getElementById('gameover-screen').classList.remove('hidden');
                }, 400);
            }

            resetGame() {
                document.getElementById('gameover-screen').classList.add('hidden');
                document.getElementById('pause-btn').classList.remove('hidden');
                this.score = 0;
                document.getElementById('hud-score').innerText = '0';
                this.frameCount = 0;
                this.initEntities();
                this.state = 'PLAYING';
                this.playerJump();
            }

            render() {
                this.ctx.save();

                // Screen Shake
                if (this.shakeTimer > 0) {
                    const dx = (Math.random() - 0.5) * this.shakeIntensity;
                    const dy = (Math.random() - 0.5) * this.shakeIntensity;
                    this.ctx.translate(dx, dy);
                }

                // Background Gradient
                const bgGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
                bgGrad.addColorStop(0, '#070b19');
                bgGrad.addColorStop(1, '#171435');
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Background Star Dust
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                this.bgParticles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                // Render Pipes
                this.pipes.forEach(pipe => {
                    const skin = SKINS[this.currentSkinIndex];
                    const pipeGrad = this.ctx.createLinearGradient(pipe.x, 0, pipe.x + CONFIG.PIPE_WIDTH, 0);
                    pipeGrad.addColorStop(0, skin.color1);
                    pipeGrad.addColorStop(1, skin.color2);

                    // Top Pipe
                    this.ctx.fillStyle = pipeGrad;
                    this.ctx.fillRect(pipe.x, 0, CONFIG.PIPE_WIDTH, pipe.top);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.globalAlpha = 0.25;
                    this.ctx.fillRect(pipe.x, 0, 6, pipe.top);
                    this.ctx.globalAlpha = 1.0;

                    // Top Pipe Cap
                    this.ctx.fillStyle = skin.core;
                    this.ctx.fillRect(pipe.x - 4, pipe.top - 16, CONFIG.PIPE_WIDTH + 8, 16);

                    // Bottom Pipe
                    const bottomY = this.height - CONFIG.GROUND_HEIGHT - pipe.bottom;
                    this.ctx.fillStyle = pipeGrad;
                    this.ctx.fillRect(pipe.x, bottomY, CONFIG.PIPE_WIDTH, pipe.bottom);
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.globalAlpha = 0.25;
                    this.ctx.fillRect(pipe.x, bottomY, 6, pipe.bottom);
                    this.ctx.globalAlpha = 1.0;

                    // Bottom Pipe Cap
                    this.ctx.fillStyle = skin.core;
                    this.ctx.fillRect(pipe.x - 4, bottomY, CONFIG.PIPE_WIDTH + 8, 16);
                });

                // Render Coins
                this.coinsList.forEach(c => {
                    if (c.collected) return;
                    this.ctx.save();
                    this.ctx.shadowColor = '#fbbf24';
                    this.ctx.shadowBlur = 12;
                    this.ctx.fillStyle = '#fbbf24';
                    this.ctx.beginPath();
                    this.ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fff9c4';
                    this.ctx.beginPath();
                    this.ctx.arc(c.x - 2, c.y - 2, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Render Ground
                const groundY = this.height - CONFIG.GROUND_HEIGHT;
                const groundGrad = this.ctx.createLinearGradient(0, groundY, 0, this.height);
                groundGrad.addColorStop(0, '#1e293b');
                groundGrad.addColorStop(1, '#090d16');
                this.ctx.fillStyle = groundGrad;
                this.ctx.fillRect(0, groundY, this.width, CONFIG.GROUND_HEIGHT);

                this.ctx.strokeStyle = SKINS[this.currentSkinIndex].color1;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, groundY);
                this.ctx.lineTo(this.width, groundY);
                this.ctx.stroke();

                // Render Particles
                this.particles.forEach(pt => {
                    this.ctx.fillStyle = pt.color;
                    this.ctx.globalAlpha = pt.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                });

                // Render Player
                this.ctx.save();
                this.ctx.translate(this.player.x, this.player.y);
                this.ctx.rotate(this.player.rotation);

                const skin = SKINS[this.currentSkinIndex];
                this.ctx.shadowColor = skin.color1;
                this.ctx.shadowBlur = 16;

                const bodyGrad = this.ctx.createRadialGradient(-4, -4, 2, 0, 0, this.player.radius);
                bodyGrad.addColorStop(0, skin.core);
                bodyGrad.addColorStop(0.6, skin.color1);
                bodyGrad.addColorStop(1, skin.color2);
                
                this.ctx.fillStyle = bodyGrad;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, this.player.radius, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.shadowBlur = 0;

                // Eye
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath();
                this.ctx.arc(6, -4, 4, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.fillStyle = '#0b0f19';
                this.ctx.beginPath();
                this.ctx.arc(7, -4, 1.5, 0, Math.PI * 2);
                this.ctx.fill();

                // Wing
                this.ctx.fillStyle = skin.core;
                this.ctx.beginPath();
                let wingOffsetY = Math.sin(this.player.wingAngle) * 4;
                this.ctx.ellipse(-4, 2 + wingOffsetY, 6, 4, Math.PI / 6, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.restore();
                this.ctx.restore();
            }

            loop(timestamp) {
                this.update();
                this.render();
                requestAnimationFrame((t) => this.loop(t));
            }
        }

        // Initialize Game on Load
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
